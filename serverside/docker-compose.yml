services:
  # Nginx reverse proxy - single entry point
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
      # Uncomment for SSL:
      # - "8443:443"
    volumes:
      - python-generated:/var/www/generated/python:ro
      - java-generated:/var/www/generated/java:ro
      - r-generated:/var/www/generated/r:ro
      - pygame-generated:/var/www/generated/pygame:ro
      # Uncomment for SSL certificates:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on: []  # Will be populated by profiles

  # Python 3 - Manager 8100, Shell 8110
  python3-shell:
    build: ./python/shell
    profiles: ["python3"]
    # Internal only - no external port
    expose:
      - "8010"
    volumes:
      - python-sessions:/tmp/sessions
    # SECURITY: hardened adversarial code-execution zone
    # SECURITY: PM2_HOME redirected to writable tmpfs because read_only:true
    # would otherwise prevent pm2-runtime from creating its $HOME/.pm2
    # working directory and server.js would never start. QA finding #1.
    environment:
      - PM2_HOME=/tmp/.pm2
    mem_limit: 500m
    mem_reservation: 375m
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp:size=100m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  python3-manager:
    build: ./python/manager
    profiles: ["python3"]
    # Internal only - nginx proxies to this
    expose:
      - "8100"
    volumes:
      - python-generated:/tmp/python-generated
    depends_on:
      - python3-shell
    environment:
      - NODE_ENV=production

  # Java - Manager 8200, Shell 8210
  java-shell:
    build: ./java/shell
    profiles: ["java"]
    expose:
      - "8010"
    volumes:
      - java-sessions:/tmp/sessions
    # SECURITY: hardened adversarial code-execution zone
    # SECURITY: PM2_HOME redirected to writable tmpfs because read_only:true
    # would otherwise prevent pm2-runtime from creating its $HOME/.pm2
    # working directory and server.js would never start. QA finding #1.
    environment:
      - PM2_HOME=/tmp/.pm2
    mem_limit: 500m
    mem_reservation: 375m
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp:size=100m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  java-manager:
    build: ./java/manager
    profiles: ["java"]
    expose:
      - "8200"
    volumes:
      - java-generated:/tmp/java-generated
    depends_on:
      - java-shell
    environment:
      - NODE_ENV=production

  # R - Manager 8300, Shell 8310
  r-shell:
    build: ./r/shell
    profiles: ["r"]
    expose:
      - "8010"
    volumes:
      - r-sessions:/tmp/sessions
    # SECURITY: hardened adversarial code-execution zone
    # SECURITY: PM2_HOME redirected to writable tmpfs because read_only:true
    # would otherwise prevent pm2-runtime from creating its $HOME/.pm2
    # working directory and server.js would never start. QA finding #1.
    environment:
      - PM2_HOME=/tmp/.pm2
    mem_limit: 500m
    mem_reservation: 375m
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp:size=100m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  r-manager:
    build: ./r/manager
    profiles: ["r"]
    expose:
      - "8300"
    volumes:
      - r-generated:/tmp/r-generated
    depends_on:
      - r-shell
    environment:
      - NODE_ENV=production

  # Pygame - Manager 8400, Worker 8010 + VNC 6080
  pygame-worker:
    build: ./pygame/worker
    profiles: ["pygame"]
    expose:
      - "8010"   # Shell socket.io
      - "6080"   # noVNC WebSocket
    volumes:
      - pygame-sessions:/tmp/pygame
    # SECURITY: hardened adversarial code-execution zone
    mem_limit: 500m
    mem_reservation: 375m
    pids_limit: 50
    read_only: true
    # SECURITY: additional tmpfs mounts because supervisord writes its main
    # log to /var/log/supervisor/supervisord.log and tracks its pidfile in
    # /var/run/. With read_only:true and no writable mount at these paths,
    # supervisord crashes on startup with "OSError: [Errno 30] Read-only
    # file system" and the container exits within 1 second. We mount
    # /var/log/supervisor (not /var/log) directly so the tmpfs lands on the
    # specific directory supervisor needs without hiding the rest of /var/log.
    # QA finding #2.
    tmpfs:
      - /tmp:size=100m
      - /var/log/supervisor:size=50m
      - /var/run:size=10m
    cap_drop:
      - ALL
    # SECURITY: SETUID and SETGID are the only two Linux capabilities added
    # back to the otherwise-stripped capability set, because supervisord runs
    # as root inside this container (Dockerfile has no USER directive) and
    # then immediately drops privileges to the unprivileged `trinket` user
    # via the `user=trinket` directive in xvnc.conf and shell.conf. Without
    # these two capabilities, supervisor fails with "couldn't setuid to 1000:
    # Could not set groups of effective user", child processes never spawn,
    # and AAP completion criterion #16 ("Adversarial-zone containers still
    # execute learner code correctly") fails for pygame. NoNewPrivs:true is
    # preserved, so these capabilities cannot be used to ESCALATE privileges
    # — only to drop them, which is exactly what supervisor needs to do.
    # QA finding #2 (full resolution).
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"

  pygame-manager:
    build: ./pygame/manager
    profiles: ["pygame"]
    expose:
      - "8100"
    volumes:
      - pygame-generated:/tmp/pygame-generated
    depends_on:
      - pygame-worker
    environment:
      - NODE_ENV=production

volumes:
  python-sessions:
  python-generated:
  java-sessions:
  java-generated:
  r-sessions:
  r-generated:
  pygame-sessions:
  pygame-generated:
